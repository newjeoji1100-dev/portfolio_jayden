<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 추가 방어벽: 이 페이지는 내 파일과 Supabase에만 연결한다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://mleyapzurbkmgkoczdin.supabase.co; connect-src https://mleyapzurbkmgkoczdin.supabase.co; base-uri 'none'; form-action 'none'">
  <title>김민재 포트폴리오</title>
  <meta name="description" content="제주의 빛과 바람을 기록하는 영상 · 사진 작가 김민재의 포트폴리오">
  <!-- 카카오톡·문자 등 링크 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="김민재 포트폴리오">
  <meta property="og:description" content="제주의 빛과 바람을 기록하는 영상 · 사진 작가 김민재의 포트폴리오">
  <meta property="og:url" content="https://newjeoji1100-dev.github.io/portfolio_jayden/">
  <meta property="og:image" content="https://newjeoji1100-dev.github.io/portfolio_jayden/images/background.jpg">
  <meta property="og:image:width" content="2000">
  <meta property="og:image:height" content="1125">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <!-- 화면 전체에 깔리는 배경 사진 + 어두운 막 -->
  <div class="background" aria-hidden="true"></div>

  <!-- 맨 위 줄: CONTACT · MENU -->
  <header class="topbar">
    <button type="button" class="topbar-button contact-button" data-target="contact">CONTACT</button>
    <button type="button" class="topbar-button menu-button" aria-expanded="false" aria-controls="menu">
      MENU
      <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
  </header>

  <!-- 첫 화면: MOTION · ABOUT · STILLS -->
  <section class="hero" id="top">
    <div class="hero-column">
      <button type="button" class="hero-link" data-target="highlights" data-filter="영상">MOTION</button>
    </div>
    <div class="hero-column">
      <button type="button" class="hero-link" data-target="about">ABOUT</button>
    </div>
    <div class="hero-column">
      <button type="button" class="hero-link" data-target="highlights" data-filter="사진">STILLS</button>
    </div>
    <span class="scroll-line" aria-hidden="true"></span>
  </section>

  <!-- MENU를 누르면 열리는 메뉴 -->
  <nav class="menu" id="menu" aria-label="메뉴" hidden>
    <button type="button" class="menu-close">CLOSE</button>
    <button type="button" class="menu-link" data-target="about">ABOUT ME</button>
    <button type="button" class="menu-link" data-target="portfolio">PORTFOLIO</button>
    <button type="button" class="menu-link" data-target="guestbook">GUESTBOOK</button>
  </nav>

  <!-- 첫 화면 아래 칸들 -->
  <main>
    <div class="content">
      <!-- 왼쪽: ABOUT ME (내용은 Supabase profile 표에서 불러온다) -->
      <section class="section about" id="about">
        <h2 class="section-title">ABOUT ME</h2>

        <div class="profile-photo" id="profile-photo">
          <!-- 프로필 사진이 없을 때 보이는 기본 모양 -->
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="46" r="22" />
            <path d="M18 112c4-26 22-40 42-40s38 14 42 40z" />
          </svg>
        </div>

        <p class="profile-name" id="profile-name"></p>
        <p class="profile-role" id="profile-title"></p>
        <p class="profile-badge" id="profile-badge" hidden></p>

        <dl class="profile-info" id="contact">
          <div class="profile-row">
            <dt>NAME</dt>
            <dd id="info-name"></dd>
          </div>
          <div class="profile-row">
            <dt>EMAIL</dt>
            <dd><a id="info-email" href="#"></a></dd>
          </div>
          <div class="profile-row">
            <dt>PHONE</dt>
            <dd><a id="info-phone" href="#"></a></dd>
          </div>
          <div class="profile-row">
            <dt>LOCATION</dt>
            <dd id="info-location"></dd>
          </div>
        </dl>
      </section>

      <!-- 오른쪽: PORTFOLIO -->
      <section class="section portfolio" id="portfolio">
        <h2 class="section-title">PORTFOLIO</h2>

        <p class="load-error" id="load-error" hidden>내용을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>

        <h3 class="headline" id="headline"></h3>
        <p class="intro" id="intro"></p>

        <div class="facts">
          <div class="fact">
            <h4 class="fact-title">EDUCATION</h4>
            <p class="fact-text" id="education"></p>
          </div>
          <div class="fact">
            <h4 class="fact-title">SKILLS &amp; TOOLS</h4>
            <p class="fact-text" id="skills"></p>
          </div>
          <div class="fact">
            <h4 class="fact-title">EXPERIENCE</h4>
            <p class="fact-text" id="experience"></p>
          </div>
        </div>

        <div class="highlights" id="highlights">
          <div class="highlights-head">
            <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
            <div class="filters" role="group" aria-label="분류 고르기">
              <button type="button" class="filter-button" data-category="전체" aria-pressed="true">ALL</button>
              <button type="button" class="filter-button" data-category="영상" aria-pressed="false">MOTION</button>
              <button type="button" class="filter-button" data-category="사진" aria-pressed="false">STILLS</button>
            </div>
          </div>
          <p class="empty" id="cards-empty" hidden>아직 카드가 없어요.</p>
          <div class="cards" id="cards"></div>
        </div>

        <blockquote class="quote" id="quote" hidden></blockquote>
      </section>
    </div>

    <!-- 방명록 (Supabase resume_guestbook 표) -->
    <section class="section guestbook" id="guestbook">
      <h2 class="section-title">GUESTBOOK</h2>

      <p class="guestbook-notice">연락처 등 개인정보는 적지 말아 주세요. 부적절한 글은 지울 수 있어요.</p>

      <div class="guestbook-form">
        <div class="field">
          <label for="guest-nickname">별명</label>
          <input id="guest-nickname" type="text" maxlength="20" autocomplete="nickname" placeholder="1~20자">
        </div>
        <div class="field">
          <label for="guest-message">한마디 <span class="counter" id="guest-counter">0 / 200</span></label>
          <textarea id="guest-message" maxlength="200" rows="3" placeholder="1~200자"></textarea>
        </div>
        <div class="guestbook-actions">
          <p class="guestbook-status" id="guest-status" role="status"></p>
          <button type="button" class="guestbook-submit" id="guest-submit">남기기</button>
        </div>
      </div>

      <p class="empty" id="guest-empty" hidden>아직 남긴 글이 없어요. 첫 글을 남겨 주세요.</p>
      <ul class="guestbook-list" id="guest-list"></ul>
    </section>
  </main>

  <!-- 맨 아래 안내 줄 -->
  <footer class="site-footer">
    <p>© 2026 김민재. 사진과 글의 무단 사용을 금지합니다. 이메일 무단 수집을 거부합니다.</p>
  </footer>

  <script src="script.js?v=4"></script>
</body>
</html>
